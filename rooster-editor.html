<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rooster Arena Editor</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f100d;
        --panel: #171814;
        --panel-2: #202018;
        --ink: #f4ecde;
        --muted: #a99f8d;
        --line: rgba(244, 236, 222, 0.16);
        --line-strong: rgba(244, 236, 222, 0.28);
        --accent: #e3ad45;
        --accent-2: #b64632;
        --good: #5e8e68;
        --cold: #395d73;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100svh;
        color: var(--ink);
        background:
          linear-gradient(90deg, rgba(227, 173, 69, 0.07), transparent 35%),
          linear-gradient(180deg, #171610 0%, #0f100d 58%, #090a08 100%);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 0 12px;
        color: var(--ink);
        background: rgba(244, 236, 222, 0.06);
        cursor: pointer;
        transition:
          border-color 140ms ease,
          background 140ms ease,
          transform 140ms ease;
      }

      button:hover {
        border-color: var(--line-strong);
        background: rgba(244, 236, 222, 0.1);
      }

      button:active {
        transform: translateY(1px);
      }

      button.primary {
        border-color: rgba(227, 173, 69, 0.62);
        background: rgba(227, 173, 69, 0.18);
      }

      button.danger {
        border-color: rgba(182, 70, 50, 0.62);
        background: rgba(182, 70, 50, 0.14);
      }

      a {
        color: var(--ink);
      }

      .shell {
        display: grid;
        grid-template-rows: 58px 1fr;
        min-height: 100svh;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        height: 58px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        background: rgba(15, 16, 13, 0.78);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: flex;
        align-items: baseline;
        min-width: 0;
        gap: 12px;
      }

      .brand strong {
        overflow: hidden;
        font-size: 14px;
        text-transform: uppercase;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .brand span,
      .status {
        color: var(--muted);
        font-size: 13px;
      }

      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(340px, 1fr) minmax(300px, 390px);
        min-height: calc(100svh - 58px);
      }

      .left,
      .stage,
      .inspector {
        min-width: 0;
        border-right: 1px solid var(--line);
      }

      .inspector {
        border-right: 0;
      }

      .left,
      .inspector {
        background: rgba(23, 24, 20, 0.76);
      }

      .section {
        padding: 18px;
        border-bottom: 1px solid var(--line);
      }

      .section h2,
      .section h3 {
        margin: 0 0 12px;
        font-size: 14px;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .final-wrap {
        display: grid;
        gap: 12px;
      }

      .final-video {
        width: 100%;
        aspect-ratio: 9 / 16;
        max-height: calc(100svh - 180px);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #050605;
        object-fit: cover;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .metric {
        min-height: 58px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(244, 236, 222, 0.04);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 15px;
      }

      .scene-list {
        display: grid;
        gap: 8px;
      }

      .scene-button {
        display: grid;
        grid-template-columns: 54px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        width: 100%;
        min-height: 70px;
        padding: 8px;
        text-align: left;
      }

      .scene-button.active {
        border-color: rgba(227, 173, 69, 0.76);
        background: rgba(227, 173, 69, 0.12);
      }

      .scene-button img {
        width: 54px;
        height: 54px;
        border-radius: 6px;
        object-fit: cover;
        background: #050605;
      }

      .scene-button strong,
      .scene-button span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .scene-button strong {
        font-size: 13px;
      }

      .scene-button span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .scene-button em {
        color: var(--accent);
        font-size: 12px;
        font-style: normal;
      }

      .stage {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        background:
          linear-gradient(180deg, rgba(57, 93, 115, 0.08), transparent 28%),
          rgba(10, 11, 9, 0.7);
      }

      .preview-area {
        display: grid;
        grid-template-columns: minmax(250px, 0.52fr) minmax(260px, 0.48fr);
        gap: 22px;
        align-items: center;
        min-height: 0;
        padding: 22px;
      }

      .phone {
        justify-self: center;
        width: min(390px, 100%);
        aspect-ratio: 9 / 16;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        overflow: hidden;
        background: #050605;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
      }

      .phone video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .shot-copy {
        align-self: center;
        display: grid;
        gap: 14px;
        max-width: 520px;
      }

      .shot-kicker {
        color: var(--accent);
        font-size: 13px;
        text-transform: uppercase;
      }

      .shot-copy h1 {
        margin: 0;
        font-size: 38px;
        line-height: 1.02;
      }

      .shot-copy p {
        margin: 0;
        color: #d8cdb9;
        font-size: 17px;
        line-height: 1.5;
      }

      .dialogue {
        display: block;
        padding-top: 6px;
        color: #fff1d0;
        font-size: 30px;
        font-weight: 800;
        line-height: 1.05;
        text-transform: uppercase;
      }

      .playbar {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 14px 18px;
        border-top: 1px solid var(--line);
        background: rgba(15, 16, 13, 0.86);
      }

      .timeline {
        display: grid;
        grid-template-columns: repeat(8, minmax(38px, 1fr));
        gap: 4px;
        height: 38px;
      }

      .timeline button {
        position: relative;
        min-height: 38px;
        padding: 0;
        overflow: hidden;
      }

      .timeline button::after {
        content: "";
        position: absolute;
        inset: auto 0 0;
        height: 3px;
        background: var(--accent);
        opacity: 0;
      }

      .timeline button.active::after {
        opacity: 1;
      }

      .timeline span {
        position: relative;
        z-index: 1;
        font-size: 12px;
      }

      .form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 10px 11px;
        color: var(--ink);
        background: rgba(5, 6, 5, 0.48);
        outline: 0;
      }

      textarea {
        min-height: 82px;
        resize: vertical;
        line-height: 1.45;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: rgba(227, 173, 69, 0.72);
      }

      input[type="range"] {
        padding: 0;
        accent-color: var(--accent);
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .audio-row {
        display: grid;
        gap: 8px;
      }

      audio {
        width: 100%;
        height: 34px;
      }

      .asset-list {
        display: grid;
        gap: 9px;
      }

      .asset {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 9px 0;
        border-bottom: 1px solid rgba(244, 236, 222, 0.09);
        color: #d8cdb9;
        font-size: 13px;
      }

      .asset:last-child {
        border-bottom: 0;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 23px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 8px;
        color: var(--muted);
        font-size: 11px;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 40;
        max-width: min(360px, calc(100vw - 36px));
        border: 1px solid rgba(227, 173, 69, 0.46);
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--ink);
        background: rgba(22, 22, 17, 0.95);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 1160px) {
        .workspace {
          grid-template-columns: 300px minmax(0, 1fr);
        }

        .inspector {
          grid-column: 1 / -1;
          border-top: 1px solid var(--line);
        }
      }

      @media (max-width: 820px) {
        .topbar {
          grid-template-columns: 1fr;
          height: auto;
          padding: 12px 14px;
        }

        .actions {
          overflow-x: auto;
          padding-bottom: 2px;
        }

        .workspace,
        .preview-area,
        .playbar {
          grid-template-columns: 1fr;
        }

        .left,
        .stage {
          border-right: 0;
        }

        .final-video {
          max-height: none;
        }

        .shot-copy h1 {
          font-size: 31px;
        }

        .dialogue {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <strong>Rooster Arena Editor</strong>
          <span id="topStatus">8 сцен · финальный cut · static build</span>
        </div>
        <div class="actions">
          <button class="primary" id="playTimeline">Play cut</button>
          <button id="exportJson">Export JSON</button>
          <button id="copyCommand">Copy render cmd</button>
          <a class="pill" href="rooster-arena-demo.html">Demo</a>
        </div>
      </header>

      <main class="workspace">
        <aside class="left">
          <section class="section final-wrap">
            <h2>Final MP4</h2>
            <video class="final-video" src="rooster-remotion.mp4" controls playsinline preload="metadata"></video>
            <div class="meta">
              <div class="metric"><span>Format</span><strong>9:16</strong></div>
              <div class="metric"><span>FPS</span><strong>30</strong></div>
              <div class="metric"><span>Length</span><strong id="finalLength">30.5s</strong></div>
            </div>
          </section>

          <section class="section">
            <h2>Scenes</h2>
            <div class="scene-list" id="sceneList"></div>
          </section>
        </aside>

        <section class="stage">
          <div class="preview-area">
            <div class="phone">
              <video id="sceneVideo" playsinline preload="metadata" poster="public/rooster/00-danangrad-intro.png"></video>
            </div>
            <article class="shot-copy">
              <span class="shot-kicker" id="shotKicker">01 · wake</span>
              <h1 id="shotTitle">Петух просыпается</h1>
              <p id="shotDescription">Глаза открываются резко, как у бойца перед финальным раундом.</p>
              <strong class="dialogue" id="shotLine">Время вставать. Пора дать бой этому дню.</strong>
            </article>
          </div>

          <div class="playbar">
            <button id="playScene">Play scene</button>
            <div class="timeline" id="timeline"></div>
            <button class="danger" id="stopPlayback">Stop</button>
          </div>
        </section>

        <aside class="inspector">
          <section class="section">
            <h2>Inspector</h2>
            <div class="form">
              <label>
                Title
                <input id="fieldTitle" autocomplete="off" />
              </label>
              <label>
                Subtitle
                <textarea id="fieldDescription"></textarea>
              </label>
              <label>
                Voice line
                <textarea id="fieldLine"></textarea>
              </label>
              <div class="grid-2">
                <label>
                  Seconds
                  <input id="fieldDuration" type="number" min="1" max="8" step="0.1" />
                </label>
                <label>
                  Voice delay
                  <input id="fieldVoiceDelay" type="number" min="0" max="4" step="0.1" />
                </label>
              </div>
              <div class="grid-2">
                <label>
                  Voice volume
                  <input id="fieldVoiceVolume" type="range" min="0" max="1.4" step="0.05" />
                </label>
                <label>
                  Bed volume
                  <input id="fieldBedVolume" type="range" min="0" max="0.5" step="0.02" />
                </label>
              </div>
              <label>
                Transition
                <select id="fieldTransition">
                  <option value="cut">cut</option>
                  <option value="whoosh">whoosh</option>
                  <option value="flash">flash</option>
                  <option value="impact">impact</option>
                </select>
              </label>
            </div>
          </section>

          <section class="section audio-row">
            <h3>Voice</h3>
            <audio id="voiceAudio" controls preload="metadata"></audio>
            <h3>Bed</h3>
            <audio id="bedAudio" controls loop preload="metadata" src="public/rooster/audio/bed.mp3"></audio>
            <h3>Music</h3>
            <audio controls loop preload="metadata" src="public/rooster/audio/music-suno-dimon-boss.mp3"></audio>
          </section>

          <section class="section">
            <h3>Assets</h3>
            <div class="asset-list" id="assetList"></div>
          </section>
        </aside>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const STORAGE_KEY = "rooster-arena-editor-v3";
      const renderCommand = "bun run render:rooster";
      const defaultScenes = [
        {
          id: "00",
          slug: "danangrad",
          title: "Дананград Продакшен",
          description: "Темная кинозаставка с эмблемой продакшена перед началом истории.",
          line: "ДАНАНГ! ГРАД! Продакшен представляет!",
          duration: 5,
          voiceDelay: 0.7,
          voiceVolume: 1.04,
          bedVolume: 0.1,
          transition: "whoosh",
          video: "public/rooster/video/00-danangrad-kling.mp4",
          poster: "public/rooster/00-danangrad-intro.png",
          voice: "public/rooster/audio/00-danangrad-intro-heavy.mp3",
        },
        {
          id: "01",
          slug: "wake",
          title: "Петух просыпается",
          description: "Глаза открываются резко, как у бойца перед финальным раундом.",
          line: "Время вставать. Пора дать бой этому дню.",
          duration: 3.4,
          voiceDelay: 0,
          voiceVolume: 1,
          bedVolume: 0.12,
          transition: "cut",
          video: "public/rooster/video/01-wake-kling.mp4",
          poster: "public/rooster/01-wake.png",
          voice: "public/rooster/audio/01-wakeup-fight-day-v3.mp3",
        },
        {
          id: "02",
          slug: "flashback",
          title: "Косуха и флешбеки",
          description: "Прошлое давит, но лицо собирается в один жесткий фокус.",
          line: "Прошлое вгоняет в печаль, но сегодня новый день.",
          duration: 3.9,
          voiceDelay: 0.2,
          voiceVolume: 1,
          bedVolume: 0.14,
          transition: "whoosh",
          video: "public/rooster/video/02-jacket-kling.mp4",
          poster: "public/rooster/02-jacket-flashbacks.png",
          voice: "public/rooster/audio/02-past-v3.mp3",
        },
        {
          id: "03",
          slug: "arena",
          title: "Выход на арену",
          description: "Старый дом, забор и земляной круг раскрываются как деревенский колизей.",
          line: "Я готов к бою с самим собой.",
          duration: 3.5,
          voiceDelay: 0.25,
          voiceVolume: 1,
          bedVolume: 0.15,
          transition: "whoosh",
          video: "public/rooster/video/03-arena-kling.mp4",
          poster: "public/rooster/03-arena-reveal.png",
          voice: "public/rooster/audio/03-arena-ready-v3.mp3",
        },
        {
          id: "04",
          slug: "corner",
          title: "Снимают косуху",
          description: "Corner crew работает ритуально: плечи открыты, толпа уже слышит удар.",
          line: "Цыпочки любят сильных.",
          duration: 3,
          voiceDelay: 0.35,
          voiceVolume: 1,
          bedVolume: 0.14,
          transition: "whoosh",
          video: "public/rooster/video/04-jacket-off-kling.mp4",
          poster: "public/rooster/04-jacket-off.png",
          voice: "public/rooster/audio/04-strong-v3.mp3",
        },
        {
          id: "05",
          slug: "charge",
          title: "День думал, что он главный",
          description: "Глаза вспыхивают, воздух втягивается к груди и клюву.",
          line: "День думал, что он главный.",
          duration: 3,
          voiceDelay: 0.45,
          voiceVolume: 1,
          bedVolume: 0.18,
          transition: "flash",
          video: "public/rooster/video/05-eyes-charge-kling.mp4",
          poster: "public/rooster/05-eyes-charge.png",
          voice: "public/rooster/audio/05-day-chief-v3.mp3",
        },
        {
          id: "06",
          slug: "beam",
          title: "Луч в небо",
          description: "Тело подается вперед, руки идут вверх, энергия бьет столбом.",
          line: "КУКАРЕКУ, ЁПТА!",
          duration: 3.5,
          voiceDelay: 0.2,
          voiceVolume: 1.2,
          bedVolume: 0.2,
          transition: "impact",
          video: "public/rooster/video/06-beam-up-kling.mp4",
          poster: "public/rooster/06-beam-up.png",
          voice: "public/rooster/audio/crow-v3-shout-epic.mp3",
          sfx: "public/rooster/audio/riser.mp3",
        },
        {
          id: "07",
          slug: "cosmic",
          title: "Благодать",
          description: "Луч из темноты раскалывает планеты перед солнцем и врезается в звезду.",
          line: "Разреши себе быть в благодати.",
          duration: 4.2,
          voiceDelay: 0.35,
          voiceVolume: 1,
          bedVolume: 0.12,
          transition: "impact",
          video: "public/rooster/video/07-sun-impact-kling.mp4",
          poster: "public/rooster/07-sun-impact.png",
          voice: "public/rooster/audio/07-grace-main-v3.mp3",
          sfx: "public/rooster/audio/impact.mp3",
        },
      ];

      const sfx = {
        whoosh: "public/rooster/audio/whoosh.mp3",
        impact: "public/rooster/audio/impact.mp3",
      };
      const introVoiceVariants = [
        ["main", "public/rooster/audio/00-danangrad-intro-heavy.mp3"],
        ["epic tight", "public/rooster/audio/00-danangrad-intro-epic-tight.mp3"],
        ["epic long", "public/rooster/audio/00-danangrad-intro-epic.mp3"],
        ["brian", "public/rooster/audio/00-danangrad-brian-heavy.mp3"],
        ["bill", "public/rooster/audio/00-danangrad-bill-heavy.mp3"],
        ["adam long", "public/rooster/audio/00-danangrad-adam-heavy.mp3"],
      ];

      let scenes = loadScenes();
      let selected = 0;
      let timelineTimer = null;
      let voiceTimer = null;
      let sfxTimer = null;
      let isTimelinePlaying = false;

      const sceneList = document.getElementById("sceneList");
      const timeline = document.getElementById("timeline");
      const sceneVideo = document.getElementById("sceneVideo");
      const voiceAudio = document.getElementById("voiceAudio");
      const bedAudio = document.getElementById("bedAudio");
      const toast = document.getElementById("toast");

      const fields = {
        title: document.getElementById("fieldTitle"),
        description: document.getElementById("fieldDescription"),
        line: document.getElementById("fieldLine"),
        duration: document.getElementById("fieldDuration"),
        voiceDelay: document.getElementById("fieldVoiceDelay"),
        voiceVolume: document.getElementById("fieldVoiceVolume"),
        bedVolume: document.getElementById("fieldBedVolume"),
        transition: document.getElementById("fieldTransition"),
      };

      function loadScenes() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return structuredClone(defaultScenes);
          const parsed = JSON.parse(saved);
          return Array.isArray(parsed.scenes) ? parsed.scenes : structuredClone(defaultScenes);
        } catch {
          return structuredClone(defaultScenes);
        }
      }

      function saveScenes() {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            updatedAt: new Date().toISOString(),
            renderCommand,
            scenes,
          }, null, 2),
        );
        document.getElementById("topStatus").textContent = "saved · 8 сцен · static build";
      }

      function renderLists() {
        sceneList.innerHTML = scenes
          .map((scene, index) => `
            <button class="scene-button ${index === selected ? "active" : ""}" data-index="${index}">
              <img src="${scene.poster}" alt="" />
              <span>
                <strong>${escapeHtml(scene.title)}</strong>
                <span>${escapeHtml(scene.line)}</span>
              </span>
              <em>${scene.duration.toFixed(1)}s</em>
            </button>
          `)
          .join("");

        timeline.innerHTML = scenes
          .map((scene, index) => `
            <button class="${index === selected ? "active" : ""}" data-index="${index}">
              <span>${scene.id}</span>
            </button>
          `)
          .join("");

        [...sceneList.querySelectorAll("button"), ...timeline.querySelectorAll("button")].forEach((button) => {
          button.addEventListener("click", () => selectScene(Number(button.dataset.index)));
        });

        const introVariants = introVoiceVariants
          .map(([label, src]) => `
            <div class="asset">
              <span>intro voice · ${escapeHtml(label)}</span>
              <a class="pill" href="${src}">audio</a>
            </div>
          `)
          .join("") + `
            <div class="asset">
              <span>music · ДИМОН — БОСС</span>
              <a class="pill" href="public/rooster/audio/music-suno-dimon-boss.mp3">audio</a>
            </div>
          `;

        document.getElementById("assetList").innerHTML = scenes
          .map((scene) => `
            <div class="asset">
              <span>${scene.id} · ${escapeHtml(scene.slug)}</span>
              <a class="pill" href="${scene.video}">video</a>
            </div>
            <div class="asset">
              <span>${scene.id} · voice</span>
              <a class="pill" href="${scene.voice}">audio</a>
            </div>
          `)
          .join("") + introVariants;
      }

      function selectScene(index) {
        selected = Math.max(0, Math.min(scenes.length - 1, index));
        stopPlayback(false);
        renderSelected();
        renderLists();
      }

      function renderSelected() {
        const scene = scenes[selected];
        document.getElementById("shotKicker").textContent = `${scene.id} · ${scene.slug}`;
        document.getElementById("shotTitle").textContent = scene.title;
        document.getElementById("shotDescription").textContent = scene.description;
        document.getElementById("shotLine").textContent = scene.line;

        sceneVideo.src = scene.video;
        sceneVideo.poster = scene.poster;
        sceneVideo.currentTime = 0;
        sceneVideo.muted = true;

        voiceAudio.src = scene.voice;
        voiceAudio.volume = Number(scene.voiceVolume);
        bedAudio.volume = Number(scene.bedVolume);

        fields.title.value = scene.title;
        fields.description.value = scene.description;
        fields.line.value = scene.line;
        fields.duration.value = scene.duration;
        fields.voiceDelay.value = scene.voiceDelay;
        fields.voiceVolume.value = scene.voiceVolume;
        fields.bedVolume.value = scene.bedVolume;
        fields.transition.value = scene.transition;
      }

      function updateSelectedFromFields() {
        const scene = scenes[selected];
        scene.title = fields.title.value;
        scene.description = fields.description.value;
        scene.line = fields.line.value;
        scene.duration = clampNumber(fields.duration.value, 1, 8, scene.duration);
        scene.voiceDelay = clampNumber(fields.voiceDelay.value, 0, 4, scene.voiceDelay);
        scene.voiceVolume = clampNumber(fields.voiceVolume.value, 0, 1.4, scene.voiceVolume);
        scene.bedVolume = clampNumber(fields.bedVolume.value, 0, 0.5, scene.bedVolume);
        scene.transition = fields.transition.value;
        saveScenes();
        renderSelected();
        renderLists();
      }

      function playScene() {
        stopPlayback(false);
        const scene = scenes[selected];
        sceneVideo.currentTime = 0;
        sceneVideo.play();
        bedAudio.volume = Number(scene.bedVolume);
        bedAudio.play();

        voiceTimer = window.setTimeout(() => {
          voiceAudio.currentTime = 0;
          voiceAudio.volume = Number(scene.voiceVolume);
          voiceAudio.play();
        }, scene.voiceDelay * 1000);

        if (scene.sfx) {
          sfxTimer = window.setTimeout(() => playOneShot(scene.sfx, 0.82), 60);
        }
      }

      function playTimelineFrom(index) {
        isTimelinePlaying = true;
        selectScene(index);
        playScene();
        timelineTimer = window.setTimeout(() => {
          if (!isTimelinePlaying) return;
          if (index + 1 >= scenes.length) {
            stopPlayback(true);
            showToast("Timeline complete");
            return;
          }
          if (scenes[index + 1].transition === "whoosh") playOneShot(sfx.whoosh, 0.52);
          if (scenes[index + 1].transition === "impact") playOneShot(sfx.impact, 0.72);
          playTimelineFrom(index + 1);
        }, scenes[index].duration * 1000);
      }

      function stopPlayback(preserveSelection = true) {
        isTimelinePlaying = false;
        window.clearTimeout(timelineTimer);
        window.clearTimeout(voiceTimer);
        window.clearTimeout(sfxTimer);
        sceneVideo.pause();
        voiceAudio.pause();
        bedAudio.pause();
        if (!preserveSelection) {
          voiceAudio.currentTime = 0;
          bedAudio.currentTime = 0;
        }
      }

      function playOneShot(src, volume) {
        const audio = new Audio(src);
        audio.volume = volume;
        audio.play();
      }

      function exportJson() {
        const data = {
          name: "Rooster Arena",
          output: "rooster-remotion.mp4",
          renderCommand,
          scenes,
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "rooster-arena-edit.json";
        link.click();
        URL.revokeObjectURL(url);
        showToast("JSON exported");
      }

      async function copyCommand() {
        const command = `${renderCommand} # output: rooster-remotion.mp4`;
        try {
          await navigator.clipboard.writeText(command);
          showToast("Render command copied");
        } catch {
          showToast(command);
        }
      }

      function clampNumber(value, min, max, fallback) {
        const number = Number(value);
        if (!Number.isFinite(number)) return fallback;
        return Math.min(max, Math.max(min, number));
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
      }

      Object.values(fields).forEach((field) => {
        field.addEventListener("input", updateSelectedFromFields);
        field.addEventListener("change", updateSelectedFromFields);
      });

      document.getElementById("playScene").addEventListener("click", playScene);
      document.getElementById("playTimeline").addEventListener("click", () => playTimelineFrom(0));
      document.getElementById("stopPlayback").addEventListener("click", () => stopPlayback(false));
      document.getElementById("exportJson").addEventListener("click", exportJson);
      document.getElementById("copyCommand").addEventListener("click", copyCommand);

      document.querySelector(".final-video").addEventListener("loadedmetadata", (event) => {
        const seconds = event.currentTarget.duration;
        if (Number.isFinite(seconds)) document.getElementById("finalLength").textContent = `${seconds.toFixed(1)}s`;
      });

      renderLists();
      renderSelected();
    </script>
  </body>
</html>
